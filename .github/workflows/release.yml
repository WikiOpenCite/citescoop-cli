name: Release

on:
  push:
    tags:
      - "*"

env:
  VCPKG_COMMIT: "f3e10653cc27d62a37a3763cd84b38bca07c6075"

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vcpkg
        uses: friendlyanon/setup-vcpkg@v1
        with: { committish: "${{ env.VCPKG_COMMIT }}" }

      - name: Install required gperf dependencies
        run: sudo apt install autoconf autoconf-archive automake libtool

      - name: Install static analyzers
        run: sudo apt-get install cppcheck -y -q

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build --preset=ci-ubuntu

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Create archive
        run: |
          # Only include the built binary, not the entire build directory
          tar -C build -czf citescoop-cli-${{ github.ref_name }}-linux-x64.tar.gz ./citescoop-cli
          sha256sum citescoop-cli-${{ github.ref_name }}-linux-x64.tar.gz > citescoop-cli-${{ github.ref_name }}-linux-x64.tar.gz.sha256

      - name: Determine release type and previous tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_PRERELEASE=false" >> $GITHUB_ENV
            PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v -x "${TAG}" | head -n1 || true)
          else
            echo "RELEASE_PRERELEASE=true" >> $GITHUB_ENV
            PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v -x "${TAG}" | head -n1 || true)
          fi
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> $GITHUB_ENV

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          generate_release_notes: true
          previous_tag: ${{ env.PREVIOUS_TAG }}
          files: |
            citescoop-cli-${{ github.ref_name }}-linux-x64.tar.gz
            citescoop-cli-${{ github.ref_name }}-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
